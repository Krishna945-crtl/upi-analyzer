# 🐳 docker compose up --build  →  web http://localhost:5173 · api http://localhost:8000
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    environment:
      MONGO_URI: mongodb://mongo:27017/upi_analyzer
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret}
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo-data:
