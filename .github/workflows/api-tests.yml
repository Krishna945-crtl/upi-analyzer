name: API tests (Postman / Newman)

on:
  push:
    paths: ['server/**', 'api-tests/**', '.github/workflows/api-tests.yml']
  pull_request:
    paths: ['server/**', 'api-tests/**']

jobs:
  newman:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the API
        working-directory: server
        run: |
          npm install
          MONGO_URI=mongodb://localhost:27017/upi_api_tests nohup node src/server.js > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ && break; sleep 1; done
      - name: Run the Postman regression suite
        working-directory: api-tests
        run: |
          npm ci
          npm test
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-junit
          path: api-tests/results/junit.xml
      - name: API log on failure
        if: failure()
        run: cat api.log
