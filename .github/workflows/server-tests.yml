name: server tests (Express + MongoDB)

on:
  push:
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
        env:
          MONGO_URI_TEST: mongodb://localhost:27017
