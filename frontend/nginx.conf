server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # React Router: unknown paths fall back to index.html (same job as vercel.json)
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
